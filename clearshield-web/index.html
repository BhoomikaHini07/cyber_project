<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearShield – Cybersecurity & Canary Trap Command Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside>
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div class="brand-info">
        <h1>ClearShield</h1>
        <span>Canary Trap Defense</span>
      </div>
    </div>

    <div class="nav-section-title">Canary & Honeypot</div>
    <ul class="nav-list">
      <li><button class="nav-item active" data-view="system-status"><span>⚡ 1. System Status</span></button></li>
      <li><button class="nav-item" data-view="canary-status"><span>🪤 2. Canary Trap Status</span></button></li>
      <li><button class="nav-item" data-view="suspicious-activity"><span>👁️ 3. Suspicious Activity</span><span class="badge" id="badge-suspicious">0</span></button></li>
      <li><button class="nav-item" data-view="blocked-requests"><span>🚫 4. Blocked Requests</span><span class="badge" id="badge-blocked">0</span></button></li>
      <li><button class="nav-item" data-view="admin-alerts"><span>📲 5. Administrator Alerts</span><span class="badge" id="badge-alerts">0</span></button></li>
      <li><button class="nav-item" data-view="incident-history"><span>📜 6. Incident History</span></button></li>
      <li><button class="nav-item" data-view="restore-system"><span>🔄 7. Restore System</span></button></li>
      <li><button class="nav-item" data-view="scenario-lab"><span>🧪 Demonstration Lab</span></button></li>
    </ul>

    <div class="nav-section-title">ClearShield Core</div>
    <ul class="nav-list">
      <li><button class="nav-item" data-view="core-overview"><span>📊 Overview & Charts</span></button></li>
      <li><button class="nav-item" data-view="core-alerts"><span>⚠️ Security Alerts</span></button></li>
      <li><button class="nav-item" data-view="core-guided"><span>🧭 Guided Actions (6-Pt)</span></button></li>
      <li><button class="nav-item" data-view="core-settings"><span>⚙️ Rule Settings</span></button></li>
      <li><button class="nav-item" data-view="core-csv"><span>📁 CSV Dataset Tools</span></button></li>
      <li><button class="nav-item" data-view="core-about"><span>ℹ️ About ClearShield</span></button></li>
    </ul>

    <div class="sidebar-footer">
      <a href="http://localhost:5001" target="_blank" class="clinic-portal-btn" id="open-clinic-link">
        <span>🏥 Open Clinic Portal</span>
        <span>↗</span>
      </a>
      <div style="font-size: 10px; color: #64748b; margin-top: 8px; text-align: center;">
        Separate Frontend · Shared Backend
      </div>
    </div>
  </aside>

  <!-- MAIN VIEWPORT -->
  <main>
    <!-- TOP STATUS HEADER -->
    <header>
      <div class="header-status">
        <div id="ambient-status-pill" class="status-pill">
          <span class="pulse-dot"></span>
          <span id="ambient-status-text">ClearShield Active: All Systems Normal</span>
        </div>
        <span class="tag tag-green" id="trap-state-tag">Row 0 Canary Armed</span>
      </div>

      <div class="header-metrics">
        <div class="metric-pill">
          <span>Decoy Latency:</span>
          <b id="metric-latency">&lt; 15ms (1.2ms)</b>
        </div>
        <div class="metric-pill">
          <span>Port 445 (SMB):</span>
          <b id="metric-smb" style="color:#10b981;">Active</b>
        </div>
        <div class="metric-pill">
          <span>Records Lost:</span>
          <b id="metric-lost" style="color:#10b981;">0 (Zero)</b>
        </div>
        <button class="btn btn-secondary" onclick="exportIncidentReport('json')">
          📥 Export Audit Report
        </button>
      </div>
    </header>

    <!-- CONTENT DISPLAY AREA -->
    <div class="content-scroll" id="view-container">
      <!-- Dynamic Views Injected Here -->
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
